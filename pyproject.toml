[project]
name = "agenda"
version = "0.1.0"
description = ""
authors = [
    {name = "Marcelo de Campos"}
]
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/agenda"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
