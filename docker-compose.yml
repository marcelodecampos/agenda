services:
  postgres:
    image: postgres:16
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agenda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agenda-keycloak
    restart: unless-stopped
    # start-dev: adequado para ambiente local; producao exige configuracao propria (TLS, hostname, etc.)
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - agenda_keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import

volumes:
  agenda_postgres_data:
  agenda_keycloak_data:
